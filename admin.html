<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeout Admin — Price Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #07070600;
      --surface:     #0f0f0d;
      --card:        #161614;
      --card-hover:  #1e1e1b;
      --gold:        #c9a84c;
      --gold-bright: #e2c06e;
      --gold-dim:    rgba(201,168,76,0.10);
      --gold-glow:   rgba(201,168,76,0.22);
      --text:        #ede8de;
      --text-soft:   #b5af9f;
      --muted:       #615d52;
      --border:      rgba(201,168,76,0.14);
      --border-soft: rgba(255,255,255,0.06);
      --red:         #e05252;
      --green:       #4caf7d;
      --radius:      14px;
      --ease:        cubic-bezier(0.34, 1.2, 0.64, 1);
      --ease-out:    cubic-bezier(0.22, 1, 0.36, 1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Outfit', sans-serif;
      background: #050504;
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── LOGIN SCREEN ─── */
    #loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      background:
        radial-gradient(ellipse 600px 400px at 50% 0%, rgba(201,168,76,0.07) 0%, transparent 70%),
        #050504;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 44px 36px 40px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04) inset;
    }

    .login-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--gold-bright);
      text-align: center;
      margin-bottom: 6px;
    }

    .login-sub {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.3px;
      margin-bottom: 36px;
    }

    .field { margin-bottom: 18px; }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.22s, box-shadow 0.22s;
    }

    .field input:focus {
      border-color: rgba(201,168,76,0.45);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.09);
    }

    .login-btn {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      background: linear-gradient(135deg, #d9b456 0%, #c9a84c 50%, #a67c1b 100%);
      color: #0a0900;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 28px rgba(201,168,76,0.40), 0 2px 0 rgba(255,255,255,0.12) inset;
      transition: transform 0.2s var(--ease), box-shadow 0.2s, filter 0.18s;
    }

    .login-btn:hover { transform: translateY(-2px); filter: brightness(1.06); box-shadow: 0 10px 36px rgba(201,168,76,0.50); }
    .login-btn:active { transform: scale(0.98); }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    #loginError {
      margin-top: 14px;
      background: rgba(224,82,82,0.10);
      border: 1px solid rgba(224,82,82,0.28);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #f08080;
      display: none;
      text-align: center;
    }

    /* ─── ADMIN PANEL ─── */
    #adminPanel { display: none; }

    /* Top bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: rgba(5,5,4,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-soft);
      gap: 16px;
    }

    .topbar-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--gold-bright);
      white-space: nowrap;
    }

    .topbar-user {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .logout-btn {
      flex-shrink: 0;
      background: rgba(224,82,82,0.12);
      border: 1px solid rgba(224,82,82,0.25);
      color: #f08080;
      padding: 7px 16px;
      border-radius: 100px;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .logout-btn:hover { background: rgba(224,82,82,0.22); color: #ff9090; }

    /* Main area */
    .admin-main {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    /* Stats bar */
    .stats-row {
      display: flex;
      gap: 14px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .stat-chip {
      flex: 1;
      min-width: 130px;
      background: var(--card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 16px 20px;
    }

    .stat-chip-val {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--gold-bright);
    }

    .stat-chip-label {
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Section header */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
    }

    /* Search & filter */
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .toolbar input[type="search"] {
      flex: 1;
      min-width: 180px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border-soft);
      border-radius: 100px;
      padding: 10px 18px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .toolbar input[type="search"]:focus { border-color: rgba(201,168,76,0.4); }
    .toolbar input[type="search"]::placeholder { color: var(--muted); }

    .toolbar select {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border-soft);
      border-radius: 100px;
      padding: 10px 16px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      -webkit-appearance: none;
    }
    .toolbar select option { background: #161614; }

    /* Item rows */
    .items-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 14px 18px;
      transition: border-color 0.25s, background 0.25s;
    }

    .item-row:hover { border-color: var(--border); background: var(--card-hover); }
    .item-row.dirty { border-color: rgba(201,168,76,0.35); }
    .item-row.saved  { border-color: rgba(76,175,125,0.45); }
    .item-row.error  { border-color: rgba(224,82,82,0.45); }

    .item-cat-badge {
      flex-shrink: 0;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 100px;
      background: var(--gold-dim);
      border: 1px solid rgba(201,168,76,0.2);
      color: var(--gold);
      white-space: nowrap;
    }

    .item-name {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      min-width: 0;
    }

    .item-name small {
      display: block;
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 400;
      margin-top: 2px;
    }

    /* Price input */
    .price-wrap {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .price-prefix {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
    }

    .price-input {
      width: 100px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--gold-bright);
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 600;
      text-align: right;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .price-input:focus {
      border-color: rgba(201,168,76,0.5);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.08);
    }

    /* Save button per row */
    .save-row-btn {
      flex-shrink: 0;
      padding: 8px 16px;
      background: var(--gold-dim);
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 8px;
      color: var(--gold-bright);
      font-family: 'Outfit', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: background 0.2s, transform 0.18s var(--ease), box-shadow 0.2s;
      white-space: nowrap;
    }
    .save-row-btn:hover { background: rgba(201,168,76,0.20); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(201,168,76,0.18); }
    .save-row-btn:active { transform: scale(0.97); }
    .save-row-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .row-status {
      flex-shrink: 0;
      font-size: 18px;
      line-height: 1;
      min-width: 20px;
      text-align: center;
      transition: opacity 0.3s;
    }

    /* Save all */
    .save-all-wrap {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: none;
    }

    .save-all-btn {
      padding: 15px 40px;
      background: linear-gradient(135deg, #d9b456 0%, #c9a84c 50%, #a67c1b 100%);
      color: #0a0900;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      box-shadow: 0 8px 36px rgba(201,168,76,0.50), 0 2px 0 rgba(255,255,255,0.12) inset;
      transition: transform 0.22s var(--ease), filter 0.18s;
      white-space: nowrap;
    }
    .save-all-btn:hover { transform: translateY(-3px); filter: brightness(1.08); }
    .save-all-btn:active { transform: scale(0.97); }
    .save-all-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(20,20,18,0.96);
      border: 1px solid rgba(201,168,76,0.25);
      color: var(--text);
      padding: 12px 24px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 500;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s var(--ease-out);
      z-index: 9999;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Loading overlay */
    #loadingOverlay {
      position: fixed; inset: 0;
      background: #050504;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 9000;
      transition: opacity 0.4s;
    }
    #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
    .load-logo { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 700; color: var(--gold-bright); }
    .load-sub  { font-size: 13px; color: var(--muted); }

    /* Mobile tweaks */
    @media (max-width: 600px) {
      .login-box { padding: 32px 22px 28px; }
      .item-row { flex-wrap: wrap; }
      .item-name { order: -1; width: 100%; }
      .price-input { width: 85px; }
    }
  </style>
</head>

  </div>

</div><!-- /adminPanel -->

<!-- Toast notification -->
<div id="toast"></div>

/* ══════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════ */
// firestorePrices: Map<itemId (number), price (number)> — loaded from Firestore
const firestorePrices = new Map();
// pendingChanges: Map<itemId, newPrice> — user edits not yet saved
const pendingChanges  = new Map();

let adminSearchQ = '';
let adminCatQ    = 'all';

/* ══════════════════════════════════════════════════
   UI HELPERS
══════════════════════════════════════════════════ */
function showToast(msg, duration = 2600) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), duration);
}

function hideLoading() {
  const el = document.getElementById('loadingOverlay');
  el.classList.add('hidden');
  setTimeout(() => el.style.display = 'none', 500);
}

function setView(view) {
  document.getElementById('loginScreen').style.display  = view === 'login'  ? 'flex'  : 'none';
  document.getElementById('adminPanel').style.display   = view === 'admin'  ? 'block' : 'none';
}

function updateStats() {
  document.getElementById('statTotal').textContent    = MENU_ITEMS.length;
  document.getElementById('statModified').textContent = firestorePrices.size;
  document.getElementById('statPending').textContent  = pendingChanges.size;

  const wrap = document.getElementById('saveAllWrap');
  wrap.style.display = pendingChanges.size > 0 ? 'block' : 'none';
}

/* ══════════════════════════════════════════════════
   RENDER ITEM LIST
══════════════════════════════════════════════════ */
function renderList() {
  const list = document.getElementById('itemsList');

  const filtered = MENU_ITEMS.filter(item => {
    if (adminCatQ !== 'all' && item.cat !== adminCatQ) return false;
    if (adminSearchQ && !item.name.toLowerCase().includes(adminSearchQ)) return false;
    return true;
  });

  if (!filtered.length) {
    list.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted);font-size:14px;">No items match your search.</div>';
    return;
  }

  list.innerHTML = filtered.map(item => {
    // Effective current price: pending edit → Firestore → original hardcoded
    const effectivePrice = pendingChanges.has(item.id)
      ? pendingChanges.get(item.id)
      : (firestorePrices.has(item.id) ? firestorePrices.get(item.id) : item.price);

    const isDirty    = pendingChanges.has(item.id);
    const isModified = firestorePrices.has(item.id);

    const rowClass = isDirty ? 'item-row dirty' : 'item-row';
    const catLabel = CAT_LABELS[item.cat] || item.cat;

    return `
      <div class="${rowClass}" id="row-${item.id}" data-id="${item.id}">
        <span class="item-cat-badge">${catLabel}</span>
        <div class="item-name">
          ${item.name}
          ${isModified && !isDirty ? '<small>✓ In Firestore</small>' : ''}
        </div>
        <div class="price-wrap">
          <span class="price-prefix">₦</span>
          <input
            class="price-input"
            type="number"
            min="0"
            step="50"
            value="${effectivePrice}"
            data-original="${item.price}"
            data-id="${item.id}"
            aria-label="Price for ${item.name}"
          />
        </div>
        <button class="save-row-btn" data-id="${item.id}">Save</button>
        <span class="row-status" id="status-${item.id}"></span>
      </div>`;
  }).join('');

  // Attach price-input listeners
  list.querySelectorAll('.price-input').forEach(input => {
    input.addEventListener('input', () => {
      const id  = parseInt(input.dataset.id, 10);
      const val = parseInt(input.value, 10);
      const row = document.getElementById(`row-${id}`);
      if (!isNaN(val) && val >= 0) {
        pendingChanges.set(id, val);
        row.className = 'item-row dirty';
      } else {
        pendingChanges.delete(id);
        row.className = 'item-row';
      }
      updateStats();
    });
  });

  // Attach save-button listeners
  list.querySelectorAll('.save-row-btn').forEach(btn => {
    btn.addEventListener('click', () => saveItem(parseInt(btn.dataset.id, 10), btn));
  });
}

/* ══════════════════════════════════════════════════
   SAVE HELPERS
══════════════════════════════════════════════════ */
async function saveItem(itemId, btn) {
  const input = document.querySelector(`.price-input[data-id="${itemId}"]`);
  const newPrice = parseInt(input ? input.value : pendingChanges.get(itemId), 10);

  if (isNaN(newPrice) || newPrice < 0) {
    showToast('⚠️ Enter a valid price first');
    return;
  }

  const statusEl = document.getElementById(`status-${itemId}`);
  const row      = document.getElementById(`row-${itemId}`);

  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  if (statusEl) statusEl.textContent = '⏳';

  try {
    // Document ID = item id as string. Field = { price: number }
    await setDoc(doc(db, 'menuPrices', String(itemId)), { price: newPrice });

    firestorePrices.set(itemId, newPrice);
    pendingChanges.delete(itemId);

    if (row)      { row.className = 'item-row saved'; setTimeout(() => { if (row) row.className = 'item-row'; }, 2000); }
    if (statusEl) { statusEl.textContent = '✅'; setTimeout(() => { if (statusEl) statusEl.textContent = ''; }, 2500); }
    showToast('✅ Price saved — live on site now');
  } catch (err) {
    console.error(err);
    if (row)      { row.className = 'item-row error'; setTimeout(() => { if (row) row.className = 'item-row dirty'; }, 2000); }
    if (statusEl) { statusEl.textContent = '❌'; setTimeout(() => { if (statusEl) statusEl.textContent = ''; }, 2500); }
    showToast('❌ Save failed: ' + err.message, 4000);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Save'; }
    updateStats();
  }
}

async function saveAllPending() {
  if (pendingChanges.size === 0) return;
  const btn = document.getElementById('saveAllBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Saving…';

  const promises = [];
  pendingChanges.forEach((price, id) => {
    promises.push(
      setDoc(doc(db, 'menuPrices', String(id)), { price })
        .then(() => { firestorePrices.set(id, price); pendingChanges.delete(id); })
    );
  });

  try {
    await Promise.all(promises);
    showToast(`✅ ${promises.length} price${promises.length > 1 ? 's' : ''} saved — live now`);
    renderList();
  } catch (err) {
    showToast('❌ Some saves failed. Try again.', 4000);
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 Save All Changes';
    updateStats();
  }
}

/* ══════════════════════════════════════════════════
   FIRESTORE LISTENER
   Loads existing prices on mount and keeps them
   in sync if another admin session makes changes.
══════════════════════════════════════════════════ */
let firestoreUnsub = null;

function startFirestoreListener() {
  if (firestoreUnsub) return;
  firestoreUnsub = onSnapshot(collection(db, 'menuPrices'), (snapshot) => {
    snapshot.forEach((docSnap) => {
      const id    = parseInt(docSnap.id, 10);
      const price = docSnap.data().price;
      if (typeof price === 'number') {
        firestorePrices.set(id, price);
      }
    });
    renderList();
    updateStats();
  }, (err) => {
    console.error('Firestore listener error:', err);
    showToast('⚠️ Could not load prices from Firestore', 5000);
  });
}

function stopFirestoreListener() {
  if (firestoreUnsub) { firestoreUnsub(); firestoreUnsub = null; }
  firestorePrices.clear();
  pendingChanges.clear();
}

/* ══════════════════════════════════════════════════
   AUTH
══════════════════════════════════════════════════ */
onAuthStateChanged(auth, (user) => {
  hideLoading();

  if (user) {
    document.getElementById('topbarUser').textContent = user.email;
    setView('admin');
    startFirestoreListener();
  } else {
    stopFirestoreListener();
    setView('login');
  }
});

/* Login form */
document.getElementById('loginBtn').addEventListener('click', async () => {
  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl    = document.getElementById('loginError');
  const btn      = document.getElementById('loginBtn');

  errEl.style.display = 'none';
  if (!email || !password) { errEl.textContent = 'Enter your email and password.'; errEl.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (err) {
    errEl.textContent = err.code === 'auth/invalid-credential'
      ? 'Wrong email or password. Try again.'
      : err.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In';
  }
});

// Allow Enter key on password field
document.getElementById('loginPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

/* Logout */
document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

/* ══════════════════════════════════════════════════
   TOOLBAR — search + filter
══════════════════════════════════════════════════ */
document.getElementById('adminSearch').addEventListener('input', e => {
  adminSearchQ = e.target.value.trim().toLowerCase();
  renderList();
});

document.getElementById('catFilter').addEventListener('change', e => {
  adminCatQ = e.target.value;
  renderList();
});

/* Save All button */
document.getElementById('saveAllBtn').addEventListener('click', saveAllPending);

</script>
