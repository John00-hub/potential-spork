<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Orders</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,Roboto,Arial,sans-serif;background:#0a0e17;color:#eef2f8;padding:14px;line-height:1.5}
.w{max-width:760px;margin:0 auto}
header{background:linear-gradient(150deg,#152238,#0b1220);border:1px solid #233049;border-radius:14px;padding:16px;margin-bottom:10px}
.k{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#F0C24B;font-weight:800}
h1{font-size:19px;margin:5px 0 3px}
.s{font-size:11.5px;color:#8fa0b8}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.st{background:rgba(255,255,255,.06);border-radius:10px;padding:10px;text-align:center}
.st b{display:block;font-size:18px;color:#F0C24B}
.st span{font-size:8.5px;text-transform:uppercase;color:#8fa0b8}
.row{display:flex;gap:8px;margin-bottom:10px}
.btn{flex:1;background:#1b2740;border:1px solid #233049;color:#eef2f8;padding:12px;border-radius:10px;font-size:13px;font-weight:700;font-family:inherit}
.btn.gold{background:linear-gradient(135deg,#F0C24B,#b8860b);color:#1a1300;border:0}
.o{background:#121a2b;border:1px solid #233049;border-radius:12px;padding:12px;margin-bottom:9px}
.top{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}
.o h3{font-size:14px;color:#F0C24B}
.amt{font-size:14px;font-weight:800;color:#10B981}
.meta{font-size:11px;color:#8fa0b8;margin-bottom:6px}
.items{font-size:12px;color:#c7d3e4;white-space:pre-wrap;background:#0b1220;border-radius:8px;padding:8px}
.line{font-size:11.5px;color:#9fb0c8;margin-top:5px}
a{color:#10B981;text-decoration:none;font-weight:700}
.empty{text-align:center;color:#8fa0b8;font-size:12.5px;padding:26px 8px}
.auth{background:#121a2b;border:1px solid #233049;border-radius:12px;padding:14px;margin-bottom:10px}
.auth input{width:100%;padding:11px;margin-bottom:8px;border-radius:9px;border:1px solid #233049;background:#0b1220;color:#eef2f8;font-size:13px;font-family:inherit}
.auth .btn{width:100%}
.err{color:#EF4444;font-size:11.5px;margin-top:6px;min-height:14px}
.warn{background:#2a1a12;border-left:4px solid #EF4444;border-radius:9px;padding:11px;font-size:11.5px;color:#f0b8a8;margin-top:10px}
</style>
</head>
<body>
<div class="w">
  <header>
    <div class="k">Timeout Restaurant · Garki 2</div>
    <h1>Orders</h1>
    <p class="s">Live from the database. Auto refreshes.</p>
    <div class="stats">
      <div class="st"><b id="t">0</b><span>Orders</span></div>
      <div class="st"><b id="d">0</b><span>Today</span></div>
      <div class="st"><b id="r">&#8358;0</b><span>Revenue</span></div>
    </div>
  </header>
  <div class="row">
    <button class="btn gold" id="rf">Refresh</button>
    <button class="btn" id="cp">Copy report</button>
  </div>
  <div class="auth" id="authBox" style="display:none">
    <div class="k">Staff sign-in required</div>
    <input type="email" id="authEmail" placeholder="admin@timeout.com.ng" autocomplete="username" />
    <input type="password" id="authPass" placeholder="Password" autocomplete="current-password" />
    <button class="btn gold" id="authBtn">Sign in</button>
    <div class="err" id="authErr"></div>
  </div>
  <div id="list"><div class="empty">Loading…</div></div>
  <div class="warn">Private. Orders are readable only by the signed-in admin account.</div>
</div>
<script>
var sb = window.__sb;
var T  = (window.TIMEOUT_SB && window.TIMEOUT_SB.tables) || { orders: 'orders' };
var DATA=[];
function ngn(n){return '\u20A6'+(Number(n)||0).toLocaleString();}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function today(){return new Date().toLocaleDateString('en-GB',{timeZone:'Africa/Lagos'});}
function render(){
  var L=document.getElementById('list');
  if(!DATA.length){
    L.innerHTML='<div class="empty">No orders recorded yet.<br><br>An order appears here within seconds of payment.</div>';
  } else {
    L.innerHTML=DATA.map(function(o){
      var p=String(o.phone||'').replace(/\D/g,'');
      if(p.indexOf('0')===0)p='234'+p.slice(1);
      var when=o.iso?new Date(o.iso).toLocaleString('en-GB',{timeZone:'Africa/Lagos'}):(o.day||'');
      return '<div class="o"><div class="top"><h3>'+esc(o.name||'Customer')+'</h3><span class="amt">'+ngn(o.total)+'</span></div>'
        +'<div class="meta">'+esc(when)+' · '+esc(o.ref||'')+'</div>'
        +'<div class="items">'+esc(o.items||'')+'</div>'
        +'<div class="line">'+esc(o.address||'')+(p?' · <a href="https://wa.me/'+p+'">'+esc(o.phone)+'</a>':'')+'</div></div>';
    }).join('');
  }
  var t=today();
  document.getElementById('t').textContent=DATA.length;
  document.getElementById('d').textContent=DATA.filter(function(o){return (o.day||'')===t;}).length;
  document.getElementById('r').textContent=ngn(DATA.reduce(function(s,o){return s+(Number(o.total)||0);},0));
}
function showAuth(show){ document.getElementById('authBox').style.display = show ? 'block' : 'none'; }

function load(){
  if(!sb){
    showAuth(true);
    document.getElementById('authErr').textContent='Supabase is not configured (supabase-config.js).';
    return;
  }
  sb.from(T.orders)
    .select('reference,name,phone,email,address,items,total,day,created_at')
    .order('created_at',{ascending:false})
    .limit(500)
    .then(function(res){
      if(res.error){
        var msg=res.error.message||'Could not load orders.';
        if(/permission|policy|jwt|token/i.test(msg)){
          showAuth(true);
          document.getElementById('authErr').textContent='Please sign in to view orders.';
        } else {
          document.getElementById('list').innerHTML='<div class="empty">Could not load: '+esc(msg)+'</div>';
        }
        return;
      }
      showAuth(false);
      DATA=(res.data||[]).map(function(r){
        return {
          ref: r.reference, name: r.name, phone: r.phone, email: r.email,
          address: r.address, items: r.items, total: r.total,
          day: r.day, iso: r.created_at
        };
      });
      render();
    })
    .catch(function(){
      document.getElementById('list').innerHTML='<div class="empty">Could not load. Check internet, then tap Refresh.</div>';
    });
}

async function doSignIn(){
  if(!sb){ return; }
  var btn=document.getElementById('authBtn');
  btn.disabled=true;
  var res=await sb.auth.signInWithPassword({
    email: document.getElementById('authEmail').value.trim(),
    password: document.getElementById('authPass').value
  });
  btn.disabled=false;
  if(res.error){ document.getElementById('authErr').textContent=res.error.message; return; }
  document.getElementById('authErr').textContent='';
  document.getElementById('authPass').value='';
  load();
}

document.getElementById('authBtn').onclick=doSignIn;
document.getElementById('authPass').addEventListener('keydown',function(e){ if(e.key==='Enter') doSignIn(); });
document.getElementById('rf').onclick=load;
document.getElementById('cp').onclick=function(){
  if(!DATA.length){alert('No orders yet.');return;}
  var t=today();
  var m='Orders report, Timeout\n\nTotal: '+DATA.length+'\nToday: '+DATA.filter(function(o){return (o.day||'')===t;}).length
   +'\nValue: '+ngn(DATA.reduce(function(s,o){return s+(Number(o.total)||0);},0))+'\n\n'
   +DATA.map(function(o,i){return (i+1)+'. '+(o.day||'')+' '+(o.name||'')+' - '+ngn(o.total);}).join('\n');
  if(navigator.clipboard)navigator.clipboard.writeText(m);
  this.textContent='Copied';var b=this;setTimeout(function(){b.textContent='Copy report';},1400);
};
(async function initOrders(){
  if(!sb){ showAuth(true); document.getElementById('authErr').textContent='Supabase is not configured (supabase-config.js).'; return; }
  try {
    var s0 = await sb.auth.getSession();
    if(s0 && s0.data && s0.data.session){ showAuth(false); load(); }
    else { showAuth(true); }
  } catch(e){ showAuth(true); }
})();
/* auto-refresh every 60s while signed in */
setInterval(function(){
  if(!sb) return;
  sb.auth.getSession().then(function(r){
    if(r && r.data && r.data.session) load();
  }).catch(function(){});
}, 60000);
</script>
</body>
</html>
